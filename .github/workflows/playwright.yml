
name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
       image: mcr.microsoft.com/playwright:v1.64.1-noble
       options: --user 1001

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Publish Playwright Test Summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const reportPath = 'playwright-report.json';
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;

          if (!fs.existsSync(reportPath)) {
            fs.appendFileSync(
              summaryPath,
              '## Playwright Test Summary\n\nJSON report not found.\n'
            );
            process.exit(0);
          }

          const report = JSON.parse(
            fs.readFileSync(reportPath, 'utf8')
          );

          const failures = [];

          function visit(suite) {
            for (const spec of suite.specs ?? []) {
              for (const test of spec.tests ?? []) {
                const results = test.results ?? [];
                const finalResult = results[results.length - 1];

                if (
                  test.outcome === 'unexpected' ||
                  ['failed', 'timedOut', 'interrupted'].includes(
                    finalResult?.status
                  )
                ) {
                  failures.push({
                    title: spec.title,
                    file: spec.file ?? suite.file ?? 'Unknown file',
                    project: test.projectName ?? 'Unknown project',
                    status: finalResult?.status ?? test.outcome,
                    errors: finalResult?.errors ?? []
                  });
                }
              }
            }

            for (const child of suite.suites ?? []) {
              visit(child);
            }
          }

          for (const suite of report.suites ?? []) {
            visit(suite);
          }

          const stats = report.stats ?? {};

          let summary = [
            '## Playwright Test Summary',
            '',
            `- **Expected:** ${stats.expected ?? 'N/A'}`,
            `- **Unexpected:** ${stats.unexpected ?? failures.length}`,
            `- **Flaky:** ${stats.flaky ?? 0}`,
            `- **Skipped:** ${stats.skipped ?? 0}`,
            ''
          ].join('\n');

          if (failures.length > 0) {
            summary += '### Failed Tests\n\n';

            for (const failure of failures) {
              summary +=
                `- **${failure.title}** — ${failure.status}\n` +
                `  - File: \`${failure.file}\`\n` +
                `  - Project: ${failure.project}\n`;

              for (const error of failure.errors) {
                summary += `  - Error: ${error.message ?? 'No error message'}\n`;
              }

              summary += '\n';
            }
          } else {
            summary += 'All tests passed. No failing tests reported.\n';
          }

          fs.appendFileSync(summaryPath, summary + '\n');
          NODE

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d allure-results ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            npm run report:allure:generate
          else
            echo "No Allure results found; skipping report generation."
          fi

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Test Diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics
          path: |
            test-results/
          retention-days: 30
          if-no-files-found: ignore
